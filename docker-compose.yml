services:
  db:
    image: postgres:16-alpine
    container_name: changeradar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: changeradar
      POSTGRES_USER: changeradar
      POSTGRES_PASSWORD: changeradar
    ports:
      - "5432:5432"
    volumes:
      - changeradar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changeradar -d changeradar"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    container_name: changeradar-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://changeradar:changeradar@db:5432/changeradar
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  changeradar_postgres:
